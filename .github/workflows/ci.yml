name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check index.html
        run: test -f index.html

      - name: Check styles.css
        run: test -f styles.css

      - name: Success
        run: echo "All required files exist!"